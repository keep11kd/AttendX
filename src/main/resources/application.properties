
spring.application.name=FaceAttendanceSystem

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/faceattendance
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.org.springframework=INFO
logging.level.com.org=DEBUG

# Multipart upload limits for face recognition

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB
